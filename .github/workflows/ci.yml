name: CI & Pages Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Lint, Typecheck, Bank QA, Unit, Build, E2E, A11y & Lighthouse
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Question bank integrity (schema, 2x pool, sql.js)
        run: npm run validate:bank

      - name: Unit & integration tests (>= 85% coverage)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Enforce bundle budget (< 200 KB gzip initial JS)
        run: npm run check:budget

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility baseline (axe-core)
        run: npm run test:a11y

      - name: E2E suite (7 roles + edge cases)
        run: npm run test:e2e

      - name: Lighthouse CI (>= 90 all categories)
        run: npx @lhci/cli@0.14.0 autorun

      - name: Upload coverage & Playwright & Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [secret-scan, quality-gate]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
